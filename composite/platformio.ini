; Composite video daughter board: original ESP32 (WROOM-32 / PICO-D4), DAC on GPIO25.
; Separate project from the P4 firmware in the parent folder. Build with: pio run -d composite
;
; ESP_8_BIT_composite only works on Arduino-ESP32 core 2.x. espressif32 6.5.0 ships
; core 2.0.14, the last version the library author verified. Do not move to core 3.x.

[platformio]
default_envs = esp32dev

[env]
platform = espressif32@6.5.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; ESP_8_BIT_composite is vendored and patched in lib/ESP_8_BIT_composite (LOCAL PATCH markers):
; it now outputs full 625-line interlaced PAL.
build_flags =
    -I ../shared   ; link_protocol.h, shared with the P4 firmware
lib_deps =
    adafruit/Adafruit GFX Library

; Full-size ESP32 DevKit / NodeMCU-32S boards
[env:esp32dev]
board = esp32dev

; "D1 Mini ESP32" style boards (CH9102F), once they arrive
[env:d1mini32]
board = wemos_d1_mini32
