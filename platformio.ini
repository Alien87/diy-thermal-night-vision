; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-p4-nano]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-p4-evboard
framework = espidf
monitor_speed = 115200
upload_speed = 921600
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv

; ESP32-P4-Pico. Same build as the NANO except the composite link pins (GPIO39-48
; are a 1.8 V domain on the Pico, so the link moves to 14-17) and v1.x silicon
; support (sdkconfig.defaults.pico, applied by CMakeLists.txt). Uses 16 MB of
; its 32 MB flash.
[env:esp32-p4-pico]
extends = env:esp32-p4-nano
build_flags = -DBOARD_ESP32_P4_PICO
